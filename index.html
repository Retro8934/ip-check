<!DOCTYPE html>

<meta charset="utf-8">

<title>Мой IP, провайдер и устройство</title>
<style>
body{background:#eef2f4;color:#14232b}
.hero,dl,.w7,#blocked,.modal .box{background:#fff;border:1px solid #d5dee3}
.isp{color:#0b6e7f}
button{background:#0b6e7f;color:#fff;border:1px solid #0b6e7f}
.err,#blocked h1{color:#b3372b}
:root{
  --bg:#eef2f4; --panel:#ffffff; --ink:#14232b; --muted:#5d6f78; --line:#d5dee3;
  --accent:#0b6e7f; --accent-ink:#ffffff; --err:#b3372b;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1a1f; --panel:#16252c; --ink:#e4eef2; --muted:#8fa5af; --line:#263941;
    --accent:#4fc3d6; --accent-ink:#06222a; --err:#f08577;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;padding:16px 16px 48px}
main,.bar{max-width:860px;margin:0 auto}
.bar{display:flex;justify-content:flex-end;margin-bottom:8px}
select{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:20px}
.ip{font:600 clamp(1.6rem,6vw,2.6rem)/1.15 ui-monospace,"Cascadia Mono",Consolas,monospace;word-break:break-all;margin:6px 0 4px}
.isp{font-size:1.15rem;color:var(--accent);font-weight:600}
.row-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:8px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
h2{font-size:1.1rem;margin:28px 0 10px}
dl{display:grid;grid-template-columns:minmax(120px,220px) 1fr;margin:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
dt,dd{margin:0;padding:10px 16px;border-bottom:1px solid var(--line)}
dt{color:var(--muted)}
dd{word-break:break-word}
dt:last-of-type,dd:last-of-type{border-bottom:0}
.err{color:var(--err)}
.status{color:var(--muted);font-size:.95rem}
#blocked{display:none;max-width:520px;margin:10vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center}
#blocked h1{color:var(--err)}
html[data-blocked] #blocked{display:block}
html[data-blocked] main{display:none}
.w7{display:none;max-width:860px;margin:0 auto 12px;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--accent);border-left-width:6px;border-radius:10px;padding:10px 16px}
.w7 span{flex:1 1 240px}
.w7 button{padding:6px 14px}
html[data-win7] .w7{display:flex}
html[data-blocked] .w7{display:none}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}
.modal .box{margin:0 auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:480px;width:100%;padding:24px}
.modal h2{margin:0 0 10px}
.modal p{margin:0 0 18px}
@media (max-width:520px){
  dl{grid-template-columns:1fr}
  dt{border-bottom:0;padding-bottom:0;font-size:.9rem}
}

<script>
/* ES3-совместимо (IE 4+). XP = NT 5.1/5.2, Vista = NT 6.0, Windows 7 = NT 6.1 */
(function(){
  var ua = navigator.userAgent || '';
  var tags = ['main','section'], i;
  for (i = 0; i < tags.length; i++) { if (document.createElement) document.createElement(tags[i]); }
  function attr(n){
    if (document.documentElement && document.documentElement.setAttribute) document.documentElement.setAttribute(n, '1');
  }
  if (/Windows NT (5\.1|5\.2|6\.0)/.test(ua)) {
    window.__blocked = true;
    attr('data-blocked');
  } else if (/Windows NT 6\.1/.test(ua)) {
    window.__win7 = true;
    attr('data-win7');
  }
})();
</script>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- язык: выбор сохраняется в localStorage ---------- */
let cur = 'ru';
const t = k => D[k][LANGS.indexOf(cur)];

function loadSavedLang(){
  try{
    const s = localStorage.getItem('site-lang');
    if(LANGS.indexOf(s) >= 0) return s;
  }catch(e){}
  const b = (navigator.language || '').slice(0,2).toLowerCase();
  return LANGS.indexOf(b) >= 0 ? b : 'ru';
}

function applyStatic(){
  document.documentElement.lang = cur;
  document.title = t('title');
  $('lang').value = cur;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  $('copy').textContent = t('copy');
}

function setLang(l){
  cur = l;
  try{ localStorage.setItem('site-lang', l); }catch(e){}
  applyStatic();
  renderNet();
  renderDevice();
}

/* ---------- таблицы ---------- */
function fill(el, rows){
  el.innerHTML = rows.filter(r => r[1] !== undefined && r[1] !== null && r[1] !== '')
    .map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
}

async function getJSON(url){
  const r = await fetch(url, {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* ---------- сеть ---------- */
let net = {state:'loading', d:null};

function renderNet(){
  if(net.state === 'loading'){
    $('ip').textContent = t('detecting'); $('isp').textContent = ''; $('net').innerHTML = '';
    return;
  }
  if(net.state === 'err'){
    $('ip').innerHTML = '<span class="err">' + esc(t('errTitle')) + '</span>';
    $('isp').textContent = t('errHint'); $('net').innerHTML = '';
    return;
  }
  const d = net.d;
  $('ip').textContent = d.ip;
  $('isp').textContent = d.isp || t('noIsp');
  fill($('net'), [
    [t('ip'), d.ip],
    [t('ver'), d.ip.indexOf(':') >= 0 ? 'IPv6' : 'IPv4'],
    [t('isp'), d.isp],
    [t('org'), d.org !== d.isp ? d.org : ''],
    ['ASN', d.asn ? 'AS' + String(d.asn).replace(/^AS/i,'') : ''],
    [t('domain'), d.domain],
    [t('country'), d.country],
    [t('region'), d.region],
    [t('city'), d.city],
    [t('ntz'), d.tz],
    [t('coords'), d.lat !== undefined ? d.lat + ', ' + d.lon : '']
  ]);
}

async function loadNet(){
  net = {state:'loading', d:null}; renderNet();
  let d = null;
  try {
    const j = await getJSON('https://ipwho.is/');
    if(j.success === false) throw new Error(j.message || 'error');
    const c = j.connection || {};
    d = {ip:j.ip, isp:c.isp || c.org, org:c.org, asn:c.asn, domain:c.domain,
         country:j.country, region:j.region, city:j.city, tz:j.timezone && j.timezone.id,
         lat:j.latitude, lon:j.longitude};
  } catch(e1){
    try {
      const j = await getJSON('https://ipapi.co/json/');
      if(j.error) throw new Error(j.reason || 'error');
      d = {ip:j.ip, isp:j.org, org:j.org, asn:j.asn, country:j.country_name,
           region:j.region, city:j.city, tz:j.timezone, lat:j.latitude, lon:j.longitude};
    } catch(e2){
      try { d = {ip:(await getJSON('https://api64.ipify.org?format=json')).ip}; }
      catch(e3){ net = {state:'err', d:null}; renderNet(); return; }
    }
  }
  net = {state:'ok', d}; renderNet();
}

let hi = {}, batt = null;

function gpu(){
  try{
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if(!gl) return '';
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  }catch(e){ return ''; }
}

function browserInfo(){
  const ua = navigator.userAgent;
  const m = re => { const r = ua.match(re); return r ? parseInt(r[1], 10) : 0; };
  const eng = m(/Chrome\/(\d+)/);
  let v;
  if(v = m(/Edg\/(\d+)/)) return {name:'Microsoft Edge', v, eng, fam:'cr'};
  if(v = m(/OPR\/(\d+)/)) return {name:'Opera', v, eng, fam:'cr'};
  if(v = m(/YaBrowser\/(\d+)/)) return {name:'Yandex Browser', v, eng, fam:'cr'};
  if(v = m(/Firefox\/(\d+)/)) return {name:'Firefox', v, eng:0, fam:'ff'};
  if(eng) return {name:'Chrome / Chromium', v:eng, eng, fam:'cr'};
  if(v = m(/Version\/(\d+).*Safari/)) return {name:'Safari', v, eng:0, fam:'sf'};
  return {name:'?', v:0, eng:0, fam:''};
}

/* Возраст по версии: Chromium 109 и Firefox 115 ESR - последние для Windows 7/8 */
function freshness(b){
  if(b.fam === 'cr') return b.eng < 110 ? 'bOld' : b.eng < 130 ? 'bDated' : 'bNew';
  if(b.fam === 'ff') return b.v < 116 ? 'bOld' : b.v < 130 ? 'bDated' : 'bNew';
  if(b.fam === 'sf') return b.v < 15 ? 'bOld' : b.v < 17 ? 'bDated' : 'bNew';
  return '';
}

/* Реальная версия Windows: User-Agent может врать, а браузер новее 109 на Windows 7/8 не запустится */
function winInfo(){
  const m = navigator.userAgent.match(/Windows NT (\d+\.\d+)/);
  if(!m && hi.platform !== 'Windows') return null;
  const b = browserInfo();
  let nt = m ? m[1] : '10.0', mismatch = false;
  const pre10 = ['5.1','5.2','6.0','6.1','6.2','6.3'].indexOf(nt) >= 0;
  const needs10 = (b.fam === 'cr' && b.eng >= 110) || (b.fam === 'ff' && b.v >= 116);
  if(pre10 && needs10){ nt = '10.0'; mismatch = true; }
  return {nt, mismatch};
}

function osName(){
  const n = navigator, ua = n.userAgent;
  const name = hi.platform || (n.userAgentData && n.userAgentData.platform) || '';
  const pv = hi.platformVersion || '';
  const w = winInfo();
  if(w){
    if(w.nt === '10.0'){
      if(pv && pv.indexOf('0.') !== 0) return 'Windows ' + (parseInt(pv, 10) >= 13 ? '11' : '10');
      return 'Windows ' + t('win1011');
    }
    const map = {'5.1':'XP','5.2':'XP / Server 2003','6.0':'Vista','6.1':'7','6.2':'8','6.3':'8.1'};
    return 'Windows ' + (map[w.nt] || w.nt);
  }
  if(name) return name + (pv ? ' ' + pv : '');
  if(/Android/.test(ua)) return 'Android';
  if(/iPhone|iPad|iPod/.test(ua)) return 'iOS';
  if(/Mac OS X/.test(ua)) return 'macOS';
  if(/Linux/.test(ua)) return 'Linux';
  return n.platform;
}

function renderDevice(){
  const n = navigator, ua = n.userAgent;
  const b = browserInfo(), w = winInfo(), fr = freshness(b);
  const isMobile = n.userAgentData ? n.userAgentData.mobile : /Mobi|Android|iPhone/i.test(ua);
  const c = n.connection || n.mozConnection || n.webkitConnection;
  fill($('dev'), [
    [t('dtype'), isMobile ? t('mobile') : t('desktop')],
    [t('os'), osName()],
    [t('arch'), hi.architecture ? hi.architecture + (hi.bitness ? ', ' + hi.bitness + ' ' + t('bit') : '') : ''],
    [t('model'), hi.model],
    [t('cpu'), n.hardwareConcurrency ? n.hardwareConcurrency + ' ' + t('cores') : ''],
    [t('ram'), n.deviceMemory ? t('atLeast') + ' ' + n.deviceMemory + ' ' + t('gb') + ' (' + t('ramCap') + ')' : t('ramNo')],
    [t('gpu'), gpu()],
    [t('screen'), screen.width + '×' + screen.height + ', ' + screen.colorDepth + ' ' + t('colorBits')],
    [t('dpr'), window.devicePixelRatio],
    [t('win'), innerWidth + '×' + innerHeight],
    [t('touch'), n.maxTouchPoints ? t('touchYes') + ' ' + n.maxTouchPoints : t('no')],
    [t('browser'), b.name + ' ' + (hi.uaFullVersion || b.v || '')],
    [t('bAge'), fr ? t(fr) : ''],
    [t('check'), w ? (w.mismatch ? t('badc') : t('okc')) : ''],
    [t('lang'), n.languages ? n.languages.join(', ') : n.language],
    [t('dtz'), Intl.DateTimeFormat().resolvedOptions().timeZone],
    [t('conn'), c && c.effectiveType],
    [t('speed'), c && c.downlink ? c.downlink + ' ' + t('mbps') : ''],
    [t('lat'), c && c.rtt !== undefined ? c.rtt + ' ' + t('ms') : ''],
    [t('battery'), batt ? Math.round(batt.level*100) + '%' + (batt.charging ? ', ' + t('charging') : '') : ''],
    ['Cookies', n.cookieEnabled ? t('on') : t('off')],
    ['User-Agent', ua]
  ]);
}

async function loadDevice(){
  renderDevice();
  const n = navigator;
  if(n.userAgentData && n.userAgentData.getHighEntropyValues){
    try{ hi = await n.userAgentData.getHighEntropyValues(['platform','platformVersion','architecture','bitness','model','uaFullVersion']); }catch(e){}
  }
  if(n.getBattery){ try{ batt = await n.getBattery(); }catch(e){} }
  renderDevice();
}

/* ---------- запуск ---------- */
$('lang').onchange = e => setLang(e.target.value);
$('copy').onclick = async () => {
  try{ await navigator.clipboard.writeText($('ip').textContent); $('copy').textContent = t('copied'); }
  catch(e){ $('copy').textContent = t('copyFail'); }
  setTimeout(() => $('copy').textContent = t('copy'), 1500);
};
$('refresh').onclick = loadNet;

const modal = $('w7modal');
const openW7 = () => { modal.classList.add('open'); $('w7close').focus(); };
const closeW7 = () => { modal.classList.remove('open'); $('w7more').focus(); };
$('w7more').onclick = openW7;
$('w7close').onclick = closeW7;
modal.onclick = e => { if(e.target === modal) closeW7(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && modal.classList.contains('open')) closeW7(); });

cur = loadSavedLang();
applyStatic();
if (!window.__blocked) {
  loadNet();
  loadDevice();
}
</script>
<script nomodule>
/* Упрощённый режим для Internet Explorer 4+ и других старых браузеров (ES3, без fetch и классов) */
(function(){
  var ua = navigator.userAgent || '';
  var lng = navigator.language || navigator.userLanguage || navigator.browserLanguage || '';
  var ru = /^ru/i.test(lng);
  function $(id){ return document.getElementById ? document.getElementById(id) : document.all[id]; }
  function T(a, b){ return ru ? a : b; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function html(id, h){ var e = $(id); if (e) e.innerHTML = h; }
  function show(id, d){ var e = $(id); if (e) e.style.display = d; }

  var LD = {
    title:['Мой IP, провайдер и устройство','My IP, provider and device'],
    sub:['Упрощённый режим для старого браузера.','Simplified mode for an old browser.'],
    yourIp:['Ваш внешний IP-адрес','Your public IP address'],
    netH:['Сеть и провайдер','Network and provider'],
    devH:['Ваше устройство','Your device'],
    blockedTitle:['Доступ закрыт','Access denied'],
    blockedText:['Эта страница не поддерживает Windows XP и Windows Vista. Эти системы давно не получают обновлений безопасности. Откройте сайт на Windows 10 и новее, macOS, Linux, Android или iOS.',
                 'This page does not support Windows XP or Windows Vista. These systems no longer receive security updates. Please open it on Windows 10 or newer, macOS, Linux, Android or iOS.'],
    w7Notice:['Скоро поддержка Windows 7 на этом сайте будет прекращена.','Support for Windows 7 on this site will end soon.'],
    w7More:['Подробнее','Learn more'],
    w7Title:['Поддержка Windows 7 заканчивается','Windows 7 support is ending'],
    w7Text:['Скоро зайти на сайт с Windows 7 будет невозможно: он будет закрываться так же, как сейчас в Windows XP и Vista. Windows 7 давно не получает обновлений безопасности. Чтобы не потерять доступ, перейдите на Windows 10 или новее, macOS, Linux, Android или iOS.',
            'Soon it will no longer be possible to open this site from Windows 7: access will be blocked just as it is now for Windows XP and Vista. Windows 7 stopped receiving security updates long ago. To keep your access, switch to Windows 10 or newer, macOS, Linux, Android or iOS.'],
    close:['Закрыть','Close']
  };

  var all = document.all || document.getElementsByTagName('*');
  var i, el, k;
  for (i = 0; i < all.length; i++) {
    el = all[i];
    k = el.getAttribute ? el.getAttribute('data-i18n') : null;
    if (k && LD[k]) el.innerHTML = LD[k][ru ? 0 : 1];
  }
  show('bar', 'none');
  show('actions', 'none');

  if (window.__blocked) {
    show('app', 'none');
    show('blocked', 'block');
    return;
  }
  if (window.__win7) {
    show('w7box', 'block');
    $('w7more').onclick = function(){ show('w7modal', 'block'); return false; };
    $('w7close').onclick = function(){ show('w7modal', 'none'); return false; };
  }

  function ieVer(){
    var t = ua.match(/Trident\/(\d+)/), m = ua.match(/MSIE (\d+)/);
    if (t) return parseInt(t[1], 10) + 4;
    if (m) return parseInt(m[1], 10);
    return 0;
  }
  function osName(){
    var m = ua.match(/Windows NT (\d+\.\d+)/);
    if (m) {
      var map = {'4.0':'NT 4.0','5.0':'2000','5.1':'XP','5.2':'XP / Server 2003','6.0':'Vista','6.1':'7','6.2':'8','6.3':'8.1','10.0':'10 / 11'};
      return 'Windows ' + (map[m[1]] || m[1]);
    }
    if (/Win 9x 4\.90/.test(ua)) return 'Windows Me';
    if (/Win(dows )?98/.test(ua)) return 'Windows 98';
    if (/Win(dows )?95/.test(ua)) return 'Windows 95';
    if (/Windows CE/.test(ua)) return 'Windows CE';
    if (/Android/.test(ua)) return 'Android';
    if (/iPhone|iPad|iPod/.test(ua)) return 'iOS';
    if (/Mac/.test(ua)) return 'macOS';
    if (/Linux/.test(ua)) return 'Linux';
    return navigator.platform || '?';
  }
  function browser(){
    var v = ieVer(), m, names = ['Firefox','OPR','Edge','Chrome','Safari'], j;
    if (v) {
      m = ua.match(/MSIE (\d+)/);
      return 'Internet Explorer ' + v + (m && ua.indexOf('Trident') >= 0 && parseInt(m[1], 10) !== v ? T(' (режим совместимости ', ' (compatibility mode ') + m[1] + ')' : '');
    }
    for (j = 0; j < names.length; j++) {
      m = ua.match(new RegExp(names[j] + '/(\\d+)'));
      if (m) return (names[j] === 'OPR' ? 'Opera' : names[j]) + ' ' + m[1];
    }
    return '?';
  }
  function rows(a){
    var h = '', j;
    for (j = 0; j < a.length; j++) {
      if (a[j][1] !== '' && a[j][1] != null) h += '<dt>' + esc(a[j][0]) + '</dt><dd>' + esc(a[j][1]) + '</dd>';
    }
    return h;
  }

  html('dev', rows([
    [T('Операционная система','Operating system'), osName()],
    [T('Браузер','Browser'), browser()],
    [T('Возраст браузера','Browser age'), T('старый','old')],
    [T('Экран','Screen'), screen.width + ' x ' + screen.height + (screen.colorDepth ? ', ' + screen.colorDepth + ' bit' : '')],
    [T('Язык','Language'), lng],
    ['Cookies', navigator.cookieEnabled ? T('включены','enabled') : T('выключены','disabled')],
    ['User-Agent', ua]
  ]));

  var got = false;
  html('ip', esc(T('определяю…','detecting…')));
  function showNet(d){
    got = true;
    html('ip', esc(d.ip));
    html('isp', esc(d.isp || T('Провайдер не определён','Provider not detected')));
    html('net', rows([
      [T('IP-адрес','IP address'), d.ip],
      [T('Версия','Version'), String(d.ip).indexOf(':') >= 0 ? 'IPv6' : 'IPv4'],
      [T('Провайдер','Provider'), d.isp],
      ['ASN', d.asn],
      [T('Страна','Country'), d.country],
      [T('Регион','Region'), d.region],
      [T('Город','City'), d.city],
      [T('Часовой пояс сети','Network time zone'), d.tz]
    ]));
  }
  /* JSONP: работает без XMLHttpRequest, подходит даже для очень старых браузеров */
  window.__ipapi = function(j){
    if (!j || j.error || !j.ip) return;
    showNet({ip:j.ip, isp:j.org, asn:j.asn, country:j.country_name, region:j.region, city:j.city, tz:j.timezone});
  };
  window.__ipify = function(j){
    if (got || !j || !j.ip) return;
    showNet({ip:j.ip});
  };
  document.write('<scr' + 'ipt src="https://ipapi.co/jsonp/?callback=__ipapi"></scr' + 'ipt>');
  document.write('<scr' + 'ipt src="https://api.ipify.org?format=jsonp&callback=__ipify"></scr' + 'ipt>');
  setTimeout(function(){
    if (got) return;
    html('ip', '<span class="err">' + esc(T('Не удалось определить','Could not detect')) + '</span>');
    html('isp', esc(T('Старый браузер может не поддерживать защищённые соединения (TLS 1.2). Откройте страницу в современном браузере.','An old browser may not support secure connections (TLS 1.2). Try a modern browser.')));
  }, 10000);
})();
</script>
